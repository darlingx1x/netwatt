name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: netwatt
          POSTGRES_PASSWORD: netwatt
          POSTGRES_DB: netwatt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U netwatt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libpangocairo-1.0-0 libcairo2
      - name: Install Python deps
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Ruff
        working-directory: backend
        run: ruff check src tests
      - name: Mypy
        working-directory: backend
        run: mypy src
      - name: Migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://netwatt:netwatt@localhost:5432/netwatt
        run: alembic upgrade head
      - name: Pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://netwatt:netwatt@localhost:5432/netwatt
        run: pytest --cov=netwatt --cov-report=xml --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build
