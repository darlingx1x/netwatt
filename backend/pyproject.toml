[project]
name = "netwatt"
version = "0.1.0"
description = "NetWatt — network energy optimization (VKR TUIT 2026)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "argon2-cffi>=23.1.0",
    "nats-py>=2.7.0",
    "python-multipart>=0.0.9",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "weasyprint>=62.3",
    "openpyxl>=3.1.5",
    "Jinja2>=3.1.4",
    "matplotlib>=3.9.0",
    "prometheus-client>=0.20.0",
    "slowapi>=0.1.9",
    "PyPDF2>=3.0.1",
    "hypothesis>=6.108.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "respx>=0.21.1",
    "pytest-docker>=3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netwatt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "PIE", "T20", "SIM", "PL", "RUF"]
ignore = ["S101", "PLR0913", "PLR2004", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PLR"]
"alembic/**/*.py" = ["N", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["nats.*", "slowapi.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
